<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-label="Multiple client bridge points">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(105,199,255,0.10)"/>
      <stop offset="1" stop-color="rgba(180,255,176,0.08)"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#69C7FF"/>
      <stop offset="1" stop-color="#B4FFB0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="880" height="420" rx="18" fill="url(#bg)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
    <g opacity="0.75" fill="rgba(255,255,255,0.72)" font-size="12">
      <text x="28" y="34">SERVER</text>
      <text x="462" y="34">CLIENT (Fiber starts here)</text>
    </g>
  </g>

  <g stroke="rgba(255,255,255,0.16)" stroke-width="1">
    <path d="M 430 70 V 356"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="14" fill="rgba(234,240,255,0.92)">
    <g>
      <rect x="28" y="70" width="368" height="60" rx="14" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.14)"/>
      <text x="48" y="104">RootLayout</text>
      <text x="330" y="104" fill="rgba(180,255,176,0.85)" font-family="ui-monospace, SFMono-Regular, Menlo" font-size="12">SERVER</text>
    </g>
    <g>
      <rect x="60" y="150" width="336" height="60" rx="14" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.14)"/>
      <text x="80" y="184">StandardLayout</text>
      <text x="322" y="184" fill="rgba(180,255,176,0.85)" font-family="ui-monospace, SFMono-Regular, Menlo" font-size="12">SERVER</text>
    </g>
    <g>
      <rect x="92" y="230" width="304" height="60" rx="14" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.14)"/>
      <text x="112" y="264">HeaderWithSearch</text>
      <text x="322" y="264" fill="rgba(180,255,176,0.85)" font-family="ui-monospace, SFMono-Regular, Menlo" font-size="12">SERVER</text>
    </g>
    <g>
      <rect x="92" y="310" width="304" height="60" rx="14" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.14)"/>
      <text x="112" y="344">SearchPage</text>
      <text x="320" y="344" fill="rgba(105,199,255,0.92)" font-family="ui-monospace, SFMono-Regular, Menlo" font-size="12">'use client'</text>
    </g>
  </g>

  <g stroke="rgba(255,255,255,0.18)" stroke-width="1.2" fill="none">
    <path d="M 212 130 V 150"/>
    <path d="M 228 210 V 230"/>
    <path d="M 244 290 V 310"/>
  </g>

  <g>
    <g filter="url(#glow)">
      <path d="M 396 180 C 445 180 445 120 494 120" stroke="url(#acc)" stroke-width="2.2" fill="none" opacity="0.95"/>
      <path d="M 396 340 C 445 340 445 270 494 270" stroke="url(#acc)" stroke-width="2.2" fill="none" opacity="0.95"/>
      <circle cx="494" cy="120" r="4" fill="#69C7FF"/>
      <circle cx="494" cy="270" r="4" fill="#B4FFB0"/>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="14" fill="rgba(234,240,255,0.92)">
    <g>
      <rect x="510" y="92" width="342" height="56" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)"/>
      <text x="530" y="126">PreviewBanner</text>
      <text x="752" y="126" fill="rgba(105,199,255,0.78)" font-family="ui-monospace, SFMono-Regular, Menlo" font-size="12">CLIENT</text>
    </g>
    <g>
      <rect x="510" y="242" width="342" height="56" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)"/>
      <text x="530" y="276">ModernSearch</text>
      <text x="760" y="276" fill="rgba(105,199,255,0.78)" font-family="ui-monospace, SFMono-Regular, Menlo" font-size="12">CLIENT</text>
    </g>
    <g>
      <rect x="540" y="312" width="312" height="56" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)"/>
      <text x="560" y="346">ResultsPanel</text>
      <text x="760" y="346" fill="rgba(105,199,255,0.62)" font-family="ui-monospace, SFMono-Regular, Menlo" font-size="12">&#8627; client</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="12">
    <text x="540" y="80" fill="rgba(255,255,255,0.62)">bridge #1</text>
    <text x="540" y="230" fill="rgba(255,255,255,0.62)">bridge #4 (nested)</text>
  </g>
</svg>
